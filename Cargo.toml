[package]
name = "cosmic-ext-applet-wifi-plus"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Omarchy-style Wi-Fi panel as a COSMIC applet"

[dependencies]
libcosmic = { git = "https://github.com/pop-os/libcosmic", rev = "d4d71fd53e5ed6bd3a430089114dffa2da3cd498", default-features = false, features = [
    "applet",
    "applet-token",
    "tokio",
    "wayland",
    "desktop",
    "qr_code",
] }
i18n-embed = { version = "0.16", features = ["fluent-system", "desktop-requester"] }
i18n-embed-fl = "0.10"
rust-embed = { version = "8", features = ["debug-embed"] }
tokio = { version = "1", features = ["time", "rt", "macros", "sync", "process"] }
futures = "0.3"
serde_json = "1"
tracing = "0.1"
tracing-subscriber = "0.3"

[profile.release]
opt-level = 2
lto = "thin"
